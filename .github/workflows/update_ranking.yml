# 毎週金曜日の18時（JST）にQiitaランキング自動更新スクリプトを定期実行するGitHub Actions設定
name: Weekly Qiita Ranking Updater

on:
  schedule:
    # UTC 09:00（JST 18:00）。毎週金曜日に自動起動
    - cron: '0 9 * * 5'
  workflow_dispatch: # 手動実行用ボタンの追加

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのコードを取得
      uses: actions/checkout@v4

    - name: Python環境のセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install requests google-generativeai

    - name: スクリプトの実行
      env:
        QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        QIITA_ARTICLE_ID: ${{ secrets.QIITA_ARTICLE_ID }}
      run: |
        python main.py
